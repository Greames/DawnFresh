name: Regenerate pnpm lockfile and verify build

on:
  push:
    branches: ["fix/critical-franchise-pilot-bugs"]

permissions:
  contents: write

jobs:
  lockfile-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/critical-franchise-pilot-bugs
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Regenerate pnpm lockfile"
            git push origin HEAD:fix/critical-franchise-pilot-bugs
          else
            echo "pnpm-lock.yaml already matches package.json"
          fi
